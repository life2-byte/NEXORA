<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { height: 100%; background: linear-gradient(135deg, #0b1220, #132033); }

  body {
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", "Inter", "Ubuntu", sans-serif;
    color: #e6eaf2;
  }

  /* Background layers: mode ke hisaab se JS in ko bharta hai (default = bg.jpeg moon wallpaper) */
  #bg-image {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    display: none;
  }
  #bg-video {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%; object-fit: cover;
    display: none;
  }
  .overlay { position: fixed; inset: 0; z-index: 2; background: rgba(11, 18, 32, 0.55); display: none; }

  .center {
    position: relative; z-index: 3; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 0 24px;
  }
  h1 { font-size: 44px; font-weight: 600; letter-spacing: 1px; }
  h1 span { color: #38bdf8; }
  .tagline { margin-top: -18px; color: #9fb0cc; font-size: 15px; }

  form { width: 100%; max-width: 640px; }
  input {
    width: 100%; padding: 16px 24px; font-size: 16px; color: #e6eaf2;
    background: rgba(17, 26, 43, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  input::placeholder { color: #8b98b0; }
  input:focus { border-color: #38bdf8; background: rgba(17, 26, 43, 0.75); }

  /* Most visited */
  #tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 700px; }
  .tile {
    width: 92px; text-decoration: none; color: #cfd8e8; text-align: center; font-size: 12px;
    padding: 10px 6px; border-radius: 14px; transition: background 0.15s;
  }
  .tile:hover { background: rgba(255, 255, 255, 0.10); }
  .tile .dot {
    width: 44px; height: 44px; margin: 0 auto 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; color: #0b1220;
  }
  .tile .dot.icon { background: rgba(255, 255, 255, 0.92); }
  .tile .dot img { width: 26px; height: 26px; object-fit: contain; }
  .tile .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div id="bg-image"></div>
  <video id="bg-video" muted loop playsinline></video>
  <div class="overlay" id="overlay"></div>

  <div class="center">
    <h1>Nexora <span>Browser</span></h1>
    <p class="tagline">AI-Powered Navigation</p>
    <form id="search-form">
      <input id="q" type="text" placeholder="Search / URL / Ask AI" autocomplete="off" autofocus>
    </form>
    <div id="tiles"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "default";   // default | image | video | none
  const src = params.get("src") || "";
  const dim = Math.min(90, Math.max(0, parseInt(params.get("dim") || "55", 10)));
  const animated = params.get("anim") !== "0";
  const engine = params.get("engine") || "https://duckduckgo.com/?q={query}";

  // ---------- background ----------
  const img = document.getElementById("bg-image");
  const video = document.getElementById("bg-video");
  const overlay = document.getElementById("overlay");

  function showImage(url) {
    img.style.backgroundImage = 'url("' + url.replace(/"/g, "%22") + '")';
    img.style.display = "block";
    overlay.style.display = "block";
  }
  if (mode === "image" && src) {
    showImage(src);
  } else if (mode === "video" && src) {
    video.src = src;
    video.style.display = "block";
    overlay.style.display = "block";
    video.addEventListener("error", () => { video.style.display = "none"; showImage("bg.jpeg"); });
    if (animated) { video.autoplay = true; video.play().catch(() => {}); }
    else { video.addEventListener("loadeddata", () => video.pause()); video.load(); }
  } else if (mode !== "none") {
    showImage("bg.jpeg");  // default: sirf moon wallpaper (image), koi video nahi
  }
  overlay.style.background = "rgba(11, 18, 32, " + (dim / 100) + ")";

  document.addEventListener("visibilitychange", () => {
    if (video.style.display === "none" || !animated || !video.src) return;
    if (document.hidden) video.pause(); else video.play().catch(() => {});
  });

  // ---------- search ----------
  function resolve(text) {
    text = text.trim();
    if (!text) return null;
    if (/^(https?:\/\/|file:\/\/)/i.test(text)) return text;
    if (text.includes(" ") || !text.includes(".")) return engine.replace("{query}", encodeURIComponent(text));
    return "https://" + text;
  }
  document.getElementById("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const url = resolve(document.getElementById("q").value);
    if (url) window.location.href = url;
  });

  // ---------- most visited ----------
  const COLORS = ["#38bdf8", "#a78bfa", "#34d399", "#fbbf24", "#f472b6", "#fb923c", "#60a5fa", "#2dd4bf"];
  try {
    const tops = JSON.parse(params.get("top") || "[]");
    const box = document.getElementById("tiles");
    tops.slice(0, 8).forEach((t, i) => {
      if (!/^https?:\/\//i.test(t.u)) return;
      const a = document.createElement("a");
      a.className = "tile";
      a.href = t.u;
      const dot = document.createElement("div");
      dot.className = "dot";
      const letter = () => { dot.className = "dot"; dot.replaceChildren(); dot.style.background = COLORS[i % COLORS.length]; dot.textContent = (t.h || "?").charAt(0).toUpperCase(); };
      if (t.i && /^file:\/\//i.test(t.i)) {
        dot.className = "dot icon";  // asli favicon; na khule to pehla harf
        const icon = document.createElement("img");
        icon.onerror = letter;
        icon.src = t.i;
        dot.appendChild(icon);
      } else {
        letter();
      }
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = t.h;
      a.append(dot, name);
      box.appendChild(a);
    });
  } catch (e) {}
</script>
</body>
</html>
